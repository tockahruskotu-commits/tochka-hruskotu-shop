<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    TikTok авторизація — Точка Хрускоту
  </title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="icon"
    href="images/brand/logo.webp"
    type="image/webp"
  >

  <style>

    :root{
      --bg:#fbf3e8;
      --card:#fffdf9;
      --ink:#2e231b;
      --muted:#746457;
      --line:rgba(69,45,28,.14);
      --ok:#2e6b42;
      --bad:#a43a30;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:var(--bg);
      color:var(--ink);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      padding:24px;
    }

    .card{
      width:min(640px,100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:26px;
      padding:30px;
      box-shadow:
        0 18px 50px
        rgba(65,42,23,.08);
      text-align:center;
    }

    .logo{
      width:72px;
      height:72px;
      border-radius:50%;
      margin-bottom:12px;
    }

    h1{
      margin:.3rem 0 .7rem;
    }

    .status{
      color:var(--muted);
      line-height:1.6;
    }

    .status.ok{
      color:var(--ok);
    }

    .status.error{
      color:var(--bad);
    }

    .backend-frame{
      position:absolute;
      width:1px;
      height:1px;
      border:0;
      opacity:0;
      pointer-events:none;
    }

  </style>
</head>


<body>

  <main class="card">

    <img
      class="logo"
      src="images/brand/logo.webp"
      alt=""
    >

    <h1>
      Точка Хрускоту
    </h1>

    <p
      class="status"
      id="status"
    >
      Завершуємо безпечне підключення TikTok…
    </p>

  </main>


  <iframe
    class="backend-frame"
    id="backendFrame"
    name="backendFrame"
    title="TikTok backend"
  ></iframe>


  <form
    id="backendForm"
    method="post"
    target="backendFrame"
    hidden
  ></form>


<script>

(function(){

  'use strict';


  const BACKEND_URL =
    'https://script.google.com/macros/s/AKfycbz9iRnTBNfG4iai2IoKlFw3PlXqs_OgCbYsUxq21GOEG2zcpvptt0EsIUZHC5JRzzkA/exec';


  const SESSION_KEY =
    'TH_TIKTOK_AUDIT_SESSION_ID';


  const status =
    document.getElementById(
      'status'
    );


  const iframe =
    document.getElementById(
      'backendFrame'
    );


  const form =
    document.getElementById(
      'backendForm'
    );


  const params =
    new URLSearchParams(
      location.search
    );


  const code =
    params.get(
      'code'
    ) || '';


  const state =
    params.get(
      'state'
    ) || '';


  const oauthError =
    params.get(
      'error'
    ) || '';


  const oauthErrorDescription =
    params.get(
      'error_description'
    ) || '';


  /*
   * Після того як ми зчитали
   * одноразовий code та state,
   * одразу прибираємо їх
   * з адресного рядка браузера.
   */
  history.replaceState(
    null,
    '',
    location.pathname
  );



  function setStatus(
    text,
    type
  ){

    status.textContent =
      text;


    status.classList.remove(
      'ok',
      'error'
    );


    if (type){

      status.classList.add(
        type
      );

    }

  }



  function postBackend(
    data
  ){

    /*
     * Очищаємо попередні
     * приховані поля форми.
     */
    while (
      form.firstChild
    ){

      form.removeChild(
        form.firstChild
      );

    }


    form.action =
      BACKEND_URL;


    Object.keys(
      data
    )
    .forEach(
      function(key){

        const input =
          document.createElement(
            'input'
          );


        input.type =
          'hidden';


        input.name =
          key;


        input.value =
          String(
            data[key] ?? ''
          );


        form.appendChild(
          input
        );

      }
    );


    form.submit();

  }



  function validBackendMessage(
    event
  ){

    /*
     * Приймаємо відповідь тільки
     * від нашого прихованого iframe.
     */
    if (
      event.source !==
      iframe.contentWindow
    ){

      return false;

    }


    const origin =
      String(
        event.origin || ''
      );


    /*
     * Apps Script Web App
     * може відповідати через
     * script.google.com або
     * googleusercontent.
     */
    return (

      origin ===
        'https://script.google.com'

      ||

      origin ===
        'https://script.googleusercontent.com'

      ||

      origin.endsWith(
        '.googleusercontent.com'
      )

    );

  }



  window.addEventListener(
    'message',

    function(event){

      if (
        !validBackendMessage(
          event
        )
      ){

        return;

      }


      const msg =
        event.data || {};


      /*
       * Успішний server-side
       * обмін authorization code
       * на TikTok session.
       */
      if (
        msg.type ===
          'TH_TIKTOK_OAUTH_COMPLETE'

        &&

        msg.ok

        &&

        msg.sessionId
      ){

        /*
         * У браузері зберігаємо
         * НЕ TikTok access token,
         * а тільки нашу випадкову
         * session ID.
         */
        sessionStorage.setItem(
          SESSION_KEY,
          String(
            msg.sessionId
          )
        );


        setStatus(
          'TikTok успішно підключено. Повертаємося до створення публікації…',
          'ok'
        );


        /*
         * Повертаємо користувача
         * на сторінку створення TikTok.
         */
        setTimeout(
          function(){

            location.replace(
              'tiktok-share.html?connected=1'
            );

          },
          700
        );


        return;

      }


      /*
       * Помилка нашого backend.
       */
      if (
        msg.type ===
          'TH_TIKTOK_ERROR'

        ||

        msg.ok === false
      ){

        setStatus(
          msg.message ||
          'TikTok повернув помилку авторизації.',
          'error'
        );

      }

    }
  );



  /*
   * TikTok сам повідомив
   * про відмову або OAuth-помилку.
   */
  if (
    oauthError
  ){

    setStatus(
      oauthErrorDescription ||
      oauthError,
      'error'
    );


    return;

  }



  /*
   * Для успішного OAuth
   * потрібні і code, і state.
   */
  if (
    !code ||
    !state
  ){

    setStatus(
      'TikTok не повернув authorization code або state. Поверніться назад і спробуйте увійти ще раз.',
      'error'
    );


    return;

  }



  /*
   * Передаємо code + state
   * нашому Apps Script backend.

   * Client Secret у браузері
   * ніколи немає.
   */
  postBackend({

    action:
      'tiktok_oauth_exchange',

    code:
      code,

    state:
      state

  });

})();

</script>

</body>
</html>
