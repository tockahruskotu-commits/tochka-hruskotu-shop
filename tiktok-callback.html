<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    TikTok авторизація — Точка Хрускоту
  </title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="icon"
    href="images/brand/logo.webp"
    type="image/webp"
  >

  <style>

    :root{
      --bg:#fbf3e8;
      --card:#fffdf9;
      --ink:#2e231b;
      --muted:#746457;
      --line:rgba(69,45,28,.14);
      --ok:#2e6b42;
      --bad:#a43a30;
      --dark:#1f1b18;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:var(--bg);
      color:var(--ink);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card{
      width:min(
        640px,
        100%
      );
      padding:30px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:26px;
      box-shadow:
        0 18px 50px
        rgba(65,42,23,.08);
      text-align:center;
    }

    .logo{
      width:72px;
      height:72px;
      border-radius:50%;
      margin-bottom:12px;
    }

    h1{
      margin:.3rem 0 .7rem;
    }

    .status{
      color:var(--muted);
      line-height:1.6;
      margin:16px 0;
    }

    .status.ok{
      color:var(--ok);
    }

    .status.error{
      color:var(--bad);
    }

    .button{
      display:inline-block;
      padding:13px 20px;
      border-radius:999px;
      background:var(--dark);
      color:white;
      text-decoration:none;
      font-weight:800;
      margin-top:12px;
    }

  </style>
</head>


<body>

  <main class="card">

    <img
      class="logo"
      src="images/brand/logo.webp"
      alt=""
    >

    <h1>
      Точка Хрускоту
    </h1>


    <p
      class="status"
      id="status"
    >
      Завершуємо безпечне підключення TikTok…
    </p>


    <a
      class="button"
      id="backButton"
      href="tiktok-share.html"
      hidden
    >
      Повернутися до TikTok
    </a>

  </main>


  <form
    id="exchangeForm"
    method="post"
    action="https://script.google.com/macros/s/AKfycbz9iRnTBNfG4iai2IoKlFw3PlXqs_OgCbYsUxq21GOEG2zcpvptt0EsIUZHC5JRzzkA/exec"
    hidden
  >

    <input
      type="hidden"
      name="action"
      value="tiktok_oauth_exchange"
    >

    <input
      type="hidden"
      id="codeInput"
      name="code"
      value=""
    >

    <input
      type="hidden"
      id="stateInput"
      name="state"
      value=""
    >

  </form>


<script>

(function(){

  'use strict';


  const status =
    document.getElementById(
      'status'
    );


  const backButton =
    document.getElementById(
      'backButton'
    );


  const form =
    document.getElementById(
      'exchangeForm'
    );


  const codeInput =
    document.getElementById(
      'codeInput'
    );


  const stateInput =
    document.getElementById(
      'stateInput'
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    String(
      params.get(
        'code'
      ) || ''
    ).trim();


  const state =
    String(
      params.get(
        'state'
      ) || ''
    ).trim();


  const oauthError =
    String(
      params.get(
        'error'
      ) || ''
    ).trim();


  const oauthErrorDescription =
    String(
      params.get(
        'error_description'
      ) || ''
    ).trim();



  function showError(
    message
  ){

    status.textContent =
      message;


    status.classList.add(
      'error'
    );


    backButton.hidden =
      false;

  }



  /*
   * TikTok повернув відмову
   * або OAuth-помилку.
   */
  if (
    oauthError
  ){

    showError(
      oauthErrorDescription ||
      oauthError
    );


    return;

  }



  /*
   * Для успішного OAuth
   * потрібні обидва значення.
   */
  if (
    !code ||
    !state
  ){

    showError(
      'TikTok не повернув authorization code або state. Поверніться назад і спробуйте увійти ще раз.'
    );


    return;

  }



  /*
   * Передаємо одноразові code + state
   * прямо нашому Apps Script backend
   * звичайною HTML-form POST.
   *
   * Client Secret тут НЕМАЄ.
   */
  codeInput.value =
    code;


  stateInput.value =
    state;


  status.textContent =
    'TikTok підтвердив вхід. Захищено передаємо авторизацію серверу…';


  /*
   * Невелика затримка лише для того,
   * щоб користувач побачив повідомлення.
   */
  setTimeout(
    function(){

      form.submit();

    },
    350
  );

})();

</script>

</body>
</html>
