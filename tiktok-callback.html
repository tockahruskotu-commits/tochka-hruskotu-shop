<!DOCTYPE html>
<html lang="uk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Підключення TikTok — Точка Хрускоту
  </title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="icon"
    href="images/brand/logo.webp"
    type="image/webp"
  >


  <style>

    :root{
      --bg:#fbf3e8;
      --card:#fffdf9;
      --ink:#2e231b;
      --muted:#746457;
      --line:rgba(69,45,28,.14);
      --dark:#1f1b18;
      --ok:#2e6b42;
      --bad:#a43a30;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:var(--bg);
      color:var(--ink);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card{
      width:min(
        640px,
        100%
      );
      padding:32px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:26px;
      box-shadow:
        0 18px 50px
        rgba(65,42,23,.08);
      text-align:center;
    }

    .logo{
      width:82px;
      height:82px;
      border-radius:50%;
      margin-bottom:14px;
    }

    h1{
      margin:.3rem 0 .7rem;
      font-size:2rem;
    }

    .status{
      color:var(--muted);
      line-height:1.65;
      margin:16px 0 24px;
    }

    .status.ok{
      color:var(--ok);
    }

    .status.error{
      color:var(--bad);
    }

    .button{
      border:0;
      border-radius:999px;
      background:var(--dark);
      color:#fff;
      padding:14px 24px;
      font:inherit;
      font-weight:900;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:260px;
    }

    .button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .note{
      margin-top:18px;
      font-size:.9rem;
      color:var(--muted);
      line-height:1.5;
    }

    [hidden]{
      display:none !important;
    }

  </style>

</head>


<body>


  <main class="card">


    <img
      class="logo"
      src="images/brand/logo.webp"
      alt=""
    >


    <h1>
      Точка Хрускоту
    </h1>


    <p
      class="status"
      id="status"
    >
      Перевіряємо відповідь TikTok…
    </p>


    <form
      id="exchangeForm"
      method="post"
      target="_top"
      action="https://script.google.com/macros/s/AKfycbz9iRnTBNfG4iai2IoKlFw3PlXqs_OgCbYsUxq21GOEG2zcpvptt0EsIUZHC5JRzzkA/exec"
      hidden
    >

      <input
        type="hidden"
        name="action"
        value="tiktok_oauth_exchange"
      >


      <input
        type="hidden"
        id="codeInput"
        name="code"
        value=""
      >


      <input
        type="hidden"
        id="stateInput"
        name="state"
        value=""
      >


      <button
        class="button"
        id="finishButton"
        type="submit"
      >
        Завершити підключення TikTok
      </button>

    </form>


    <a
      class="button"
      id="backButton"
      href="tiktok-share.html"
      hidden
    >
      Повернутися до сторінки TikTok
    </a>


    <p
      class="note"
      id="note"
    >
      На цьому етапі нічого не публікується.
    </p>


  </main>



<script>

(function(){

  'use strict';


  const status =
    document.getElementById(
      'status'
    );


  const form =
    document.getElementById(
      'exchangeForm'
    );


  const codeInput =
    document.getElementById(
      'codeInput'
    );


  const stateInput =
    document.getElementById(
      'stateInput'
    );


  const finishButton =
    document.getElementById(
      'finishButton'
    );


  const backButton =
    document.getElementById(
      'backButton'
    );


  const note =
    document.getElementById(
      'note'
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    String(
      params.get(
        'code'
      ) || ''
    ).trim();


  const state =
    String(
      params.get(
        'state'
      ) || ''
    ).trim();


  const oauthError =
    String(
      params.get(
        'error'
      ) || ''
    ).trim();


  const oauthErrorDescription =
    String(
      params.get(
        'error_description'
      ) || ''
    ).trim();



  function showError(
    message
  ){

    status.textContent =
      message;


    status.classList.add(
      'error'
    );


    form.hidden =
      true;


    backButton.hidden =
      false;


    note.textContent =
      'Нічого не було опубліковано. Почніть підключення TikTok ще раз.';

  }



  /*
   * TikTok повернув OAuth-помилку
   * або користувач не підтвердив вхід.
   */
  if (
    oauthError
  ){

    showError(
      oauthErrorDescription ||
      oauthError
    );


    return;

  }



  /*
   * Для завершення OAuth
   * потрібні і code, і state.
   */
  if (
    !code ||
    !state
  ){

    showError(
      'Не отримано authorization code або state від TikTok.'
    );


    return;

  }



  /*
   * Передаємо code і state
   * тільки після окремої
   * дії користувача.
   */
  codeInput.value =
    code;


  stateInput.value =
    state;


  status.textContent =
    'TikTok підтвердив вхід ✅ Тепер завершіть безпечне підключення.';


  status.classList.add(
    'ok'
  );


  form.hidden =
    false;



  /*
   * Одноразові параметри вже
   * записані у приховані поля.
   * Прибираємо їх з адресного рядка.
   */
  history.replaceState(
    null,
    '',
    window.location.pathname
  );



  form.addEventListener(
    'submit',
    function(){

      finishButton.disabled =
        true;


      finishButton.textContent =
        'Завершуємо підключення…';


      status.textContent =
        'Захищено передаємо authorization code серверу…';


      status.classList.remove(
        'ok'
      );


      note.textContent =
        'Client Secret і TikTok tokens залишаються на сервері.';

    }
  );


})();

</script>


</body>
</html>
