<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Відгуки — Точка Хрускоту</title><meta name="description" content="Відгуки покупців і запитання про товари Точки Хрускоту."><link rel="stylesheet" href="./css/base.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/static.css"></head><body><div data-site-header></div><main><section class="page-hero site-shell"><span class="section-kicker">Досвід покупців</span><h1>Відгуки та запитання</h1><p>Читайте враження про смаколики або залиште власний відгук чи запитання про конкретний товар.</p><a class="button button-secondary" data-google-review href="#" rel="noopener noreferrer">Залишити відгук у Google</a></section><section class="section section--soft"><div class="site-shell review-grid" data-reviews-list><div class="empty-state">Завантажуємо відгуки…</div></div></section><section class="section"><div class="site-shell"><div class="section-head"><div><span class="section-kicker">Напишіть нам</span><h2>Залишити відгук або запитання</h2></div></div><form class="feedback-form" data-feedback-form><div class="form-row"><div class="field"><label for="feedbackType">Тип</label><select id="feedbackType" name="feedbackType"><option value="review">Відгук</option><option value="question">Запитання</option></select></div><div class="field"><label for="productCode">Товар</label><select id="productCode" name="productCode" data-feedback-product required></select></div></div><div class="form-row"><div class="field"><label for="feedbackName">Ваше ім’я</label><input id="feedbackName" name="name" autocomplete="name" required></div><div class="field"><label for="feedbackRating">Оцінка</label><select id="feedbackRating" name="rating"><option value="">Оберіть</option><option value="5">5 — відмінно</option><option value="4">4 — добре</option><option value="3">3 — нормально</option><option value="2">2</option><option value="1">1</option></select></div></div><div class="field"><label for="feedbackText">Текст</label><textarea id="feedbackText" name="text" required></textarea></div><p class="form-status" data-form-status aria-live="polite"></p><button class="button button-primary" type="submit">Надіслати</button></form></div></section></main><div data-site-footer></div><script type="module" src="./js/reviews.js"></script></body></html>
