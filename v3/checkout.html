<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Оформлення замовлення — Точка Хрускоту</title><meta name="description" content="Оформлення замовлення Точки Хрускоту."><link rel="stylesheet" href="./css/base.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/static.css"><link rel="stylesheet" href="./css/checkout.css"></head><body><div data-site-header></div><main class="site-shell checkout-page"><div data-checkout-form-wrap><span class="section-kicker">Майже готово</span><h1>Оформлення замовлення</h1><div class="checkout-layout"><form data-checkout-form><section class="checkout-card"><h2>Ваші дані</h2><div class="checkout-fields"><div class="field"><label for="coName">Ім’я</label><input id="coName" name="name" autocomplete="given-name" required></div><div class="field"><label for="coSurname">Прізвище</label><input id="coSurname" name="surname" autocomplete="family-name" required></div><div class="field field--full"><label for="coPhone">Телефон</label><input id="coPhone" name="phone" type="tel" autocomplete="tel" placeholder="+380XXXXXXXXX" required></div></div></section><section class="checkout-card"><h2>Доставка</h2><div class="checkout-fields"><div class="field field--full"><label for="coDelivery">Спосіб отримання</label><select id="coDelivery" name="deliveryCode" required><option>Завантажуємо…</option></select></div><div class="field" data-region-field hidden><label for="coRegion">Область</label><input id="coRegion" name="region"></div><div class="field" data-city-field hidden><label for="coCity">Місто / населений пункт</label><input id="coCity" name="city"></div><div class="field field--full" data-branch-field hidden><label for="coBranch" data-branch-label>Відділення або поштомат</label><input id="coBranch" name="branch"></div><div class="field field--full"><label for="coDate">Бажана дата отримання (необов’язково)</label><input id="coDate" name="desiredDate" type="date"></div></div><p data-delivery-note></p></section><section class="checkout-card"><h2>Оплата й додатково</h2><div class="checkout-fields"><div class="field field--full"><label for="coPayment">Спосіб оплати</label><select id="coPayment" name="paymentCode" required><option>Завантажуємо…</option></select></div></div><label class="checkbox-line"><input type="checkbox" name="isGift"><span><strong>Це подарунок</strong><br>Після оформлення допоможемо погодити деталі сюрпризу.</span></label><label class="checkbox-line"><input type="checkbox" name="hasCertificate"><span>У мене є подарунковий сертифікат</span></label><div class="field" data-certificate-field hidden><label for="coCertificate">Код сертифіката</label><input id="coCertificate" name="certificateCode"></div><div class="field"><label for="coComment">Коментар</label><textarea id="coComment" name="comment" rows="4"></textarea></div><label class="checkbox-line"><input type="checkbox" name="termsAccepted" required><span>Погоджуюся з <a href="./terms.html">умовами замовлення</a> та <a href="./privacy.html">політикою конфіденційності</a>.</span></label></section><p class="checkout-status" data-checkout-status aria-live="polite"></p><button class="button button-primary button-block" type="submit" data-submit-order>Оформити замовлення</button></form><aside class="checkout-card checkout-summary"><h2>Ваше замовлення · <span data-checkout-count>0</span></h2><div data-checkout-items></div><div class="checkout-total"><span>Разом</span><strong data-checkout-total>0 грн</strong></div><a class="text-link" href="./catalog.html">← Повернутися до каталогу</a></aside></div></div><section class="checkout-success" data-checkout-success hidden><span class="section-kicker">Замовлення прийнято</span><h2>Дякуємо!</h2><p>Номер: <strong data-success-number></strong></p><p>Ми зв’яжемося з вами для підтвердження деталей.</p><a class="button button-primary" href="./catalog.html">Повернутися до каталогу</a></section></main><div data-site-footer></div><script type="module" src="./js/checkout-page.js"></script></body></html>
