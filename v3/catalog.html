<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow,noarchive">
  <title>Каталог — Точка Хрускоту</title><meta name="description" content="Каталог Точки Хрускоту: хрумкі солодощі, подарунки, міні-формати та новинки ручної роботи.">
  <link rel="stylesheet" href="./css/base.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/catalog.css">
</head>
<body>
  <div data-site-header></div><p class="store-status" data-store-status hidden></p>
  <main>
    <section class="catalog-hero site-shell"><span class="section-kicker">Точка Хрускоту</span><h1>Каталог</h1><p>Обирайте за категорією, шукайте за смаком або назвою. Ціни та доступність завантажуються з нашої єдиної таблиці.</p></section>
    <section class="catalog-toolbar"><div class="site-shell"><div class="catalog-toolbar__row"><input class="search-field" data-catalog-search type="search" placeholder="Пошук: шоколад, вафлі, подарунок…" aria-label="Пошук товарів"><select class="sort-field" data-catalog-sort aria-label="Сортування"><option value="default">За замовчуванням</option><option value="price-asc">Спочатку дешевші</option><option value="price-desc">Спочатку дорожчі</option><option value="name">За назвою</option></select></div><div class="filter-row" data-category-filters aria-label="Категорії"></div></div></section>
    <section class="site-shell catalog-products"><div class="catalog-meta"><span data-result-count>Завантажуємо…</span></div><div class="product-grid" data-catalog-grid><div class="empty-state">Завантажуємо товари…</div></div></section>
  </main>
  <div data-site-footer></div><script type="module" src="./js/catalog-page.js"></script>
</body>
</html>
